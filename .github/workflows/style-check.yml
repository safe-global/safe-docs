name: Style check

on: pull_request

jobs:
  vale-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Vale Linter
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff  # v3.0.0
        with:
          vale_flags: "--glob=pages/**/*.{md,mdx} --minAlertLevel=error"
          fail_on_error: true
