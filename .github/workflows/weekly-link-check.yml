name: Weekly link check

on:
  schedule:
  - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068  # v1.1.3
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        folder-path: './'
        config-file: 'linkchecker-config.json'
        base-branch: 'main'
    - name: Create Issue
      if: ${{ failure() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh issue create \
          --title "Link Checker Report" \
          --label "report" \
          --label "automated issue" \
          --body "Broken links found: [Failed Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          Workflow: \`${{ github.workflow }}\`"
